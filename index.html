<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#111111" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Drunk Ape Filter</title>
    <link rel="stylesheet" href="styles.css?v=12" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main id="desktop-gate" class="gate">
      <div class="gate-card">
        <h1>Open on your phone</h1>
        <p>This camera only runs on a mobile device.</p>
      </div>
    </main>

    <main id="rotate-gate" class="gate" hidden>
      <div class="gate-card">
        <h1>Turn your phone upright</h1>
        <p>The camera is portrait only.</p>
      </div>
    </main>

    <div id="fit" class="fit" hidden>
      <div id="screen" class="screen">
        <video id="camera" class="camera" autoplay playsinline muted></video>
        <canvas id="mesh" class="mesh" aria-hidden="true"></canvas>
        <canvas id="ape" class="mesh" aria-hidden="true"></canvas>
        <canvas id="grab" class="grab"></canvas>
        <div class="flash" id="flash"></div>

        <header class="top-bar"></header>

        <div class="stage">
          <p id="rec" class="rec" hidden>
            <i></i>
            <span id="rec-time">0:00</span>
          </p>

          <div class="apes">
            <button
              type="button"
              class="ape is-on"
              data-ape="al"
              aria-pressed="true"
              aria-label="Al"
            >
              <span class="al-crop">
                <img src="assets/al.png" alt="" />
              </span>
            </button>
            <button
              type="button"
              class="ape"
              data-ape="dav"
              aria-pressed="false"
              aria-label="Dav"
            >
              <img class="dav" src="assets/dav.png" alt="" />
            </button>
          </div>

          <div id="notice" class="notice" hidden>
            <p id="notice-text"></p>
            <button type="button" id="retry">Try again</button>
          </div>
        </div>

        <footer class="controls">
          <button type="button" class="shutter" id="shutter" disabled aria-label="Take photo">
            <span class="shutter-core"></span>
          </button>

          <button type="button" class="thumb" id="thumb" disabled aria-label="No capture yet"></button>

          <div class="modes" role="group" aria-label="Capture mode">
            <button type="button" class="mode" data-mode="video" aria-pressed="false">VIDEO</button>
            <button type="button" class="mode is-on" data-mode="photo" aria-pressed="true">PHOTO</button>
          </div>

          <button type="button" class="flip" id="flip" aria-label="Flip camera">
            <img src="assets/flip.svg" alt="" width="37" height="37" />
          </button>
        </footer>
      </div>
    </div>

    <script src="app.js?v=20"></script>
  </body>
</html>
